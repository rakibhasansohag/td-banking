[databases]
td_banking = host=shared-postgres-db-vsq3j1 port=5432 dbname=td_banking

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

pool_mode = session
max_client_conn = 100
default_pool_size = 5
reserve_pool_size = 0
max_db_connections = 10
max_db_client_connections = 100
max_user_connections = 10

auth_type = scram-sha-256
auth_file = /run/secrets/userlist

client_tls_sslmode = verify-ca
client_tls_cert_file = /run/secrets/gateway-cert
client_tls_key_file = /run/secrets/gateway-key
client_tls_ca_file = /run/secrets/client-ca

server_tls_sslmode = verify-full
server_tls_ca_file = /run/secrets/upstream-ca

server_idle_timeout = 600
server_lifetime = 3600
ignore_startup_parameters = extra_float_digits
pidfile = /tmp/pgbouncer.pid

# Deliberately no admin_users, stats_users, or pgbouncer database mapping.
